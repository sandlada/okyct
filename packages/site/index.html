<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--seo:start-->
    <title>OKYCT — Perceptual color engine for emissive displays</title>
    <meta
      name="description"
      content="OKYCT is a zero-dependency perceptual color engine for OLED, AMOLED and MicroOLED displays. OKLab hue, CIE-anchored tone, zero-drift gamut mapping and O(1) WCAG / APCA contrast."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://okyct.sandlada.dev/" />
    <!--seo:end-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..600;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // 默认亮色模式；仅在用户显式选择暗色时提前应用，避免首帧闪白。
      try {
        if (localStorage.getItem('okyct.theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (error) {
        // 隐私模式下 localStorage 不可用，保持默认亮色即可。
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
