<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="OKYCT — perceptual color engine for emissive displays">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A73E8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#7C4DFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF5A3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="18%" stop-color="#4C8DFF"/>
      <stop offset="36%" stop-color="#7C4DFF"/>
      <stop offset="54%" stop-color="#C24BFF"/>
      <stop offset="72%" stop-color="#FF5A3C"/>
      <stop offset="88%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#00A87E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>

  <circle cx="1010" cy="300" r="330" fill="url(#glow)"/>
  <g opacity="0.85">
