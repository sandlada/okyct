    <circle cx="30" cy="26" r="12" fill="#FF5A3C" fill-opacity="0.7"/>
    <text x="58" y="28" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#111111" letter-spacing="-0.5">OKYCT</text>
