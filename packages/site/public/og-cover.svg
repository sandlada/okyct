  <text x="90" y="268" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="72" font-weight="600" fill="#111111" letter-spacing="-3">Color that behaves</text>
  <text x="90" y="348" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="72" font-weight="600" fill="url(#spectrum)" letter-spacing="-3">like light.</text>

  <text x="92" y="410" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="22" fill="#555555">
    A zero-dependency perceptual color engine for OLED, AMOLED and MicroOLED.
