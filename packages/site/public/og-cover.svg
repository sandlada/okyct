    <circle cx="960" cy="205" r="2" fill="#7C4DFF"/>
    <circle cx="1080" cy="160" r="2.5" fill="#FF5A3C"/>
    <circle cx="1120" cy="300" r="2" fill="#00A87E"/>
    <circle cx="900" cy="330" r="2.5" fill="#FFB300"/>
    <circle cx="1010" cy="440" r="3" fill="#C24BFF"/>
    <circle cx="1140" cy="470" r="2" fill="#4C8DFF"/>
    <circle cx="850" cy="480" r="2" fill="#FF5A3C"/>
    <circle cx="760" cy="220" r="2" fill="#7C4DFF"/>
    <circle cx="700" cy="380" r="2.5" fill="#1A73E8"/>
  </g>

  <g transform="translate(90 96)">
